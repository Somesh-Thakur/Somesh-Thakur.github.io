name: Deploy sketchbook to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every day so the "right now" sticky note shows fresh GitHub activity.
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # read-only token GitHub gives every run; lifts the API rate limit for the sticky note
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: itch.io API key for live views per game (Settings → Secrets → Actions)
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          # public by design (row level security protects the data); set under
          # Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
